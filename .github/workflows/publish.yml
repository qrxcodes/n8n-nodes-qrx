name: Publish

# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere, and npm
# adds a provenance attestation, which n8n requires for verified community nodes.
# See RELEASING.md for the release flow and the one-time npm setup.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=${{ steps.version.outputs.version }}
          if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
            echo "::notice::${name}@${version} is already on npm; nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later.
      - if: steps.published.outputs.exists != 'true'
        run: npm install -g npm@^11.5.1 && npm --version
      - if: steps.published.outputs.exists != 'true'
        run: npm ci
      - if: steps.published.outputs.exists != 'true'
        run: npm run build && npm test
      # In GitHub Actions, `n8n-node release` lints, builds and runs `npm publish` with provenance.
      - if: steps.published.outputs.exists != 'true'
        run: npm run release
